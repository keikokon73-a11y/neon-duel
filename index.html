<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON DUEL HOCKEY - SHORT CODE EDITION</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+1p:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS 1p', 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #090f1f 0%, #030611 100%);
      color: #f8fafc;
      overflow: hidden;
      margin: 0; padding: 0; height: 100vh; width: 100vw;
      user-select: none; -webkit-user-select: none;
    }
    .font-neon { font-family: 'Orbitron', monospace; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.4); border-radius: 9999px; }
    button { touch-action: manipulation !important; cursor: pointer; }
    #gameCanvas { touch-action: none; }
    .color-dot { width: 38px; height: 28px; border-radius: 8px; transition: all 0.15s ease-out; border: 2px solid transparent; }
    .color-dot.active { transform: scale(1.1); box-shadow: 0 0 14px currentColor; border-color: #ffffff; }
  </style>
</head>
<body class="relative w-screen h-screen flex flex-col items-center justify-center p-1 sm:p-3 overflow-hidden">

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-slate-950/85 backdrop-blur-md overflow-y-auto">
    <div class="relative w-full max-w-md bg-slate-900/95 border border-slate-700/80 rounded-3xl shadow-2xl p-6 overflow-hidden flex flex-col justify-between my-auto z-10 max-h-[95vh] overflow-y-auto custom-scrollbar">
      
      <div class="text-center relative z-20">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/90 border border-slate-700 text-cyan-400 text-xs mb-2 font-bold tracking-wider">
          <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          SHORT CODE ONLINE P2P
        </div>
        <h1 class="font-neon text-3xl sm:text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-200 to-rose-400">
          NEON DUEL
        </h1>
        <p class="font-neon text-[11px] tracking-widest text-slate-400 font-semibold mt-0.5">TACTICAL CYBER AIR HOCKEY</p>
      </div>

      <!-- Match Settings -->
      <div class="my-4 space-y-3.5 relative z-20">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1.5">対戦モード</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" id="btnModeCpu" class="py-2 px-2 rounded-xl border-2 border-cyan-500 bg-cyan-500/20 text-cyan-300 font-bold text-xs flex flex-col items-center justify-center gap-1 transition">
              <span class="text-sm">🤖</span><span>VS CPU</span>
            </button>
            <button type="button" id="btnModeOnline" class="py-2 px-2 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-400 font-bold text-xs flex flex-col items-center justify-center gap-1 transition">
              <span class="text-sm">🌐</span><span>オンライン</span>
            </button>
            <button type="button" id="btnModePvp" class="py-2 px-2 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-400 font-bold text-xs flex flex-col items-center justify-center gap-1 transition">
              <span class="text-sm">👥</span><span>2Pローカル</span>
            </button>
          </div>
        </div>

        <!-- Online Panel -->
        <div id="onlinePanel" class="hidden p-3.5 rounded-2xl bg-slate-950/90 border border-sky-500/40 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-sky-400">4桁コード対戦 (P2P)</span>
            <span id="netStatusBadge" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">未接続</span>
          </div>

          <div class="space-y-2">
            <div class="flex gap-2">
              <button type="button" id="btnCreateRoom" class="flex-1 py-2 px-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold text-xs transition">部屋を作成する</button>
              <button type="button" id="btnJoinRoom" class="flex-1 py-2 px-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 font-bold text-xs transition">参加する</button>
            </div>

            <!-- Host Box -->
            <div id="hostInfoBox" class="hidden p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2 text-center">
              <div class="text-[11px] text-slate-400">あなたの4桁ルームコード:</div>
              <div id="myPeerIdDisplay" class="font-mono text-xl font-black text-cyan-400 tracking-widest py-1 bg-slate-950 rounded-lg border border-slate-800">----</div>
              <button type="button" id="btnCopyInvite" class="w-full py-1.5 rounded-lg bg-sky-500/20 text-sky-300 font-bold text-xs border border-sky-500/40 transition">📋 コードをコピー</button>
            </div>

            <!-- Join Box -->
            <div id="joinInfoBox" class="hidden p-2.5 rounded-xl bg-slate-900 border border-slate-800 space-y-2">
              <input type="text" id="targetPeerInput" placeholder="例: 4K92" maxlength="6" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-cyan-300 font-mono text-sm focus:outline-none focus:border-cyan-500 text-center uppercase tracking-widest">
              <button type="button" id="btnConnectPeer" class="w-full py-2 rounded-lg bg-cyan-500 text-slate-950 font-bold text-xs transition">接続して対戦開始</button>
            </div>
          </div>
        </div>

        <!-- Color Customizer -->
        <div class="p-3 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-2.5">
          <div>
            <div class="flex items-center justify-between text-xs mb-1.5 font-bold">
              <span class="text-slate-300">🎨 あなたのマレット色</span>
              <span id="p1ColorLabel" class="font-neon text-cyan-400 font-bold">CYAN</span>
            </div>
            <div class="flex items-center justify-between gap-1.5" id="p1ColorPalette"></div>
          </div>
        </div>

        <!-- CPU Difficulty -->
        <div id="diffSection">
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-bold text-slate-400">CPU難易度</label>
            <span id="diffDesc" class="text-[11px] text-white font-bold">ふつう (バランス型)</span>
          </div>
          <div class="grid grid-cols-4 gap-1.5">
            <button type="button" data-diff="easy" class="btn-diff py-2 rounded-xl bg-slate-800 text-emerald-400 text-xs font-bold border border-slate-700">かんたん</button>
            <button type="button" data-diff="normal" class="btn-diff py-2 rounded-xl bg-white/20 text-white text-xs font-bold border-2 border-white">ふつう</button>
            <button type="button" data-diff="hard" class="btn-diff py-2 rounded-xl bg-slate-800 text-amber-400 text-xs font-bold border border-slate-700">強い</button>
            <button type="button" data-diff="expert" class="btn-diff py-2 rounded-xl bg-slate-800 text-rose-500 text-xs font-bold border border-slate-700">激ムズ</button>
          </div>
        </div>

        <!-- Target Points -->
        <div id="ptsSection">
          <label class="block text-xs font-bold text-slate-400 mb-1.5">勝利ポイント</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-pts="3" class="btn-pts py-2 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold border border-slate-700">3点先取</button>
            <button type="button" data-pts="5" class="btn-pts py-2 rounded-xl bg-cyan-500/20 text-cyan-300 text-xs font-bold border-2 border-cyan-500">5点先取</button>
            <button type="button" data-pts="7" class="btn-pts py-2 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold border border-slate-700">7点先取</button>
          </div>
        </div>
      </div>

      <div class="space-y-2.5 relative z-20">
        <button type="button" id="btnStartGame" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-sky-400 to-blue-600 text-slate-950 font-black font-neon rounded-2xl shadow-xl text-base tracking-wider flex items-center justify-center gap-2">
          <span>START MATCH</span><span>⚡</span>
        </button>
      </div>
    </div>
  </div>

  <!-- GAME VIEW -->
  <div id="gameView" class="relative w-full h-full max-w-5xl flex flex-col items-center justify-between p-1 sm:p-2.5 z-10">
    <header class="w-full flex items-center justify-between px-3 sm:px-5 py-2 bg-slate-900/95 rounded-2xl border border-slate-800 shadow-xl z-20 shrink-0">
      <button type="button" id="btnBackToHome" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700">🏠 ホーム</button>
      <div class="flex items-center space-x-4 font-neon">
        <div class="flex items-center space-x-2">
          <span id="p2HudBadge" class="text-xs px-2 py-0.5 rounded font-bold border">CPU</span>
          <span id="scoreP2El" class="text-2xl font-black min-w-[24px] text-center">0</span>
        </div>
        <span class="text-slate-600 font-bold text-xl">:</span>
        <div class="flex items-center space-x-2">
          <span id="scoreP1El" class="text-2xl font-black min-w-[24px] text-center">0</span>
          <span id="p1HudBadge" class="text-xs px-2 py-0.5 rounded font-bold border">1P</span>
        </div>
      </div>
      <button type="button" id="btnGameSoundToggle" class="p-2 rounded-xl bg-slate-800 text-slate-300 text-xs border border-slate-700">🔊</button>
    </header>

    <main class="relative w-full flex-1 flex items-center justify-center my-1.5 overflow-hidden min-h-0">
      <div id="arenaBox" class="relative w-full h-full bg-slate-950 rounded-2xl border-2 border-slate-700 shadow-2xl flex items-center justify-center">
        <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>
        <div id="goalBanner" class="absolute pointer-events-none opacity-0 scale-50 transition-all duration-300 font-neon text-5xl font-black px-10 py-3 rounded-2xl backdrop-blur-xl border border-white/20 shadow-2xl z-30">GOAL!</div>
      </div>
    </main>
  </div>

  <script>
    const PALETTES = [
      { id: 'cyan', name: 'CYAN', hex: '#06b6d4', core: '#e0f2fe', glow: '#06b6d4' },
      { id: 'emerald', name: 'EMERALD', hex: '#10b981', core: '#d1fae5', glow: '#10b981' },
      { id: 'amber', name: 'AMBER', hex: '#f59e0b', core: '#fef3c7', glow: '#f59e0b' },
      { id: 'rose', name: 'ROSE', hex: '#f43f5e', core: '#ffe4e6', glow: '#f43f5e' }
    ];

    let p1ColorIndex = 0, p2ColorIndex = 3;
    let gameMode = 'PvC';
    let isOnlineHost = false;
    let peer = null, peerConn = null;
    let cpuDifficulty = 'normal', targetScore = 5;
    let scoreP1 = 0, scoreP2 = 0;
    let isGameOver = false, isPaused = false;
    let arenaW = 0, arenaH = 0, goalW = 0, goalH = 10;
    const keys = {}, particles = [];

    const puck = { x: 0, y: 0, radius: 6.8, vx: 0, vy: 0, maxSpeed: 22.0, trail: [] };
    const barP1 = { x: 0, y: 0, w: 56, h: 12, vx: 0, vy: 0, color: PALETTES[0] };
    const barP2 = { x: 0, y: 0, w: 56, h: 12, vx: 0, vy: 0, color: PALETTES[3] };
    const remoteTarget = { puckX: 0, puckY: 0, p2X: 0, p2Y: 0 };

    let canvas, ctx, arenaBox, homeScreen;

    function resizeArena() {
      if (!arenaBox || !canvas) return;
      const rect = arenaBox.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      arenaW = rect.width; arenaH = rect.height;
      canvas.width = arenaW * dpr; canvas.height = arenaH * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      goalW = Math.max(arenaW * 0.20, 88);
      barP1.w = barP2.w = Math.max(arenaW * 0.10, 52);
      barP1.h = barP2.h = Math.max(arenaH * 0.019, 11);
      puck.radius = Math.max(barP1.h * 0.58, 6.8);
      barP1.x = arenaW / 2; barP1.y = arenaH * 0.88;
      barP2.x = arenaW / 2; barP2.y = arenaH * 0.12;
      if (puck.x === 0) resetPuck(1);
    }

    function resetPuck(serv = 1) {
      puck.x = arenaW / 2; puck.y = arenaH / 2; puck.trail = [];
      const angle = (serv === 1 ? Math.PI / 2 : -Math.PI / 2) + (Math.random() * 0.6 - 0.3);
      puck.vx = Math.cos(angle) * 4.5; puck.vy = Math.sin(angle) * 4.5;
    }

    // 短い4桁コード生成 (例: ND-4K92)
    function generateShortRoomCode() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let code = '';
      for (let i = 0; i < 4; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return 'ND-' + code;
    }

    function initPeerInstance(desiredId = null, onReady = null) {
      if (peer) { try { peer.destroy(); } catch(e){} }
      const finalId = desiredId || generateShortRoomCode();
      peer = new Peer(finalId, {
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('open', (id) => {
        document.getElementById('netStatusBadge').textContent = '準備完了';
        if (onReady) onReady(id);
      });

      peer.on('connection', (conn) => {
        isOnlineHost = true;
        setupPeerConnection(conn);
      });
    }

    function setupPeerConnection(conn) {
      peerConn = conn;
      conn.on('open', () => {
        document.getElementById('netStatusBadge').textContent = '接続成功！対戦開始';
        document.getElementById('netStatusBadge').className = 'text-[10px] px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-mono';
        setTimeout(() => {
          homeScreen.classList.add('hidden');
          resizeArena();
        }, 300);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      arenaBox = document.getElementById('arenaBox');
      homeScreen = document.getElementById('homeScreen');

      document.getElementById('btnModeCpu').onclick = () => { gameMode = 'PvC'; document.getElementById('onlinePanel').classList.add('hidden'); };
      document.getElementById('btnModePvp').onclick = () => { gameMode = 'PvP'; document.getElementById('onlinePanel').classList.add('hidden'); };
      document.getElementById('btnModeOnline').onclick = () => {
        gameMode = 'Online';
        document.getElementById('onlinePanel').classList.remove('hidden');
        initPeerInstance();
      };

      document.getElementById('btnCreateRoom').onclick = () => {
        document.getElementById('hostInfoBox').classList.remove('hidden');
        document.getElementById('joinInfoBox').classList.add('hidden');
        isOnlineHost = true;
        initPeerInstance(null, (id) => {
          document.getElementById('myPeerIdDisplay').textContent = id;
        });
      };

      document.getElementById('btnJoinRoom').onclick = () => {
        document.getElementById('joinInfoBox').classList.remove('hidden');
        document.getElementById('hostInfoBox').classList.add('hidden');
        isOnlineHost = false;
      };

      document.getElementById('btnCopyInvite').onclick = () => {
        const code = document.getElementById('myPeerIdDisplay').textContent;
        navigator.clipboard.writeText(code).then(() => {
          alert('コードをコピーしました: ' + code);
        });
      };

      document.getElementById('btnConnectPeer').onclick = () => {
        const val = document.getElementById('targetPeerInput').value.trim().toUpperCase();
        const targetId = val.startsWith('ND-') ? val : 'ND-' + val;
        if (!targetId) return;
        const conn = peer.connect(targetId);
        setupPeerConnection(conn);
      };

      document.getElementById('btnStartGame').onclick = () => {
        homeScreen.classList.add('hidden');
        resizeArena();
      };

      document.getElementById('btnBackToHome').onclick = () => {
        homeScreen.classList.remove('hidden');
      };

      window.addEventListener('resize', resizeArena);
      resizeArena();
      requestAnimationFrame(render);
    });

    function render() {
      if (!ctx || homeScreen.classList.contains('hidden') === false) {
        requestAnimationFrame(render); return;
      }
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, arenaW, arenaH);
      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
